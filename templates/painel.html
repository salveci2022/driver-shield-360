<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1a">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Painel — Driver Shield 360</title>
<link rel="stylesheet" href="/static/css/painel.css">
</head>
<body>

<!-- ══ TELA DE ATIVAÇÃO DO SOM ══ -->
<div class="ativacao-overlay" id="ativacao">
  <img class="s-005618f2" src="/static/icon-512.png" alt="Driver Shield 360">
  <div class="ativ-titulo">Painel de Monitoramento</div>
  <div class="ativ-sub">Toque para ativar o painel. A sirene tocará automaticamente quando um SOS for disparado.</div>
  <button class="ativ-btn" data-acao="ativarPainel">🛡️ ATIVAR PAINEL</button>
</div>

<!-- ══ HEADER ══ -->
<div class="header" id="main-header">
  <div class="logo">DRIVER<span>·SHIELD</span> 360</div>
  <div class="header-right">
    <div class="live-badge" id="live-badge">
      <div class="ldot" id="ldot"></div>
      <span id="live-txt">Ao vivo</span>
    </div>
    <button class="hbtn verde" id="btn-sirene" data-acao="toggleSirene">🔊 Sirene</button>
    <a href="/motorista" class="hbtn azul">🛡️ Motorista</a>
    <button class="hbtn cinza" data-acao="reiniciar">🔄 Reiniciar</button>
    <button class="hbtn vermelho" data-acao="limparTodos">🗑️ Limpar</button>
    <form class="s-8a1834eb" method="POST" action="/painel/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit" class="hbtn cinza">Sair</button></form>
  </div>
</div>

<!-- Banner alerta ativo -->
<div class="alerta-banner" id="alerta-banner">
  <div class="banner-txt">🚨 <span id="banner-txt">ALERTA ATIVO!</span></div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-cell"><div class="stat-num red" id="cnt-ativos">–</div><div class="stat-lbl">Alertas ativos</div></div>
  <div class="stat-cell"><div class="stat-num blue" id="cnt-total">–</div><div class="stat-lbl">Total</div></div>
  <div class="stat-cell"><div class="stat-num green" id="cnt-resolvidos">–</div><div class="stat-lbl">Resolvidos</div></div>
</div>

<!-- Viagem ativa -->
<div class="s-0a98ee48">
  <div class="viagem-banner oculto" id="viagem-banner">
    <div>
      <div class="viagem-lbl">⏰ Modo viagem ativo</div>
      <div class="viagem-motorista" id="viagem-motorista">—</div>
    </div>
    <div class="viagem-timer" id="viagem-timer">--:--</div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-title">Ocorrências</div>
  <div class="toolbar-btns">
    <a href="/relatorio.pdf" class="btn-sm primary" target="_blank">📄 PDF</a>
    <a href="/relatorio" class="btn-sm">📊 Relatório</a>
  </div>
</div>

<!-- Filtros -->
<div class="filtro-bar">
  <button class="filtro-btn ativo" data-acao="filtrar" data-filtro="todos">Todos</button>
  <button class="filtro-btn" data-acao="filtrar" data-filtro="ativo">🔴 Ativos</button>
  <button class="filtro-btn" data-acao="filtrar" data-filtro="resolvido">✅ Resolvidos</button>
  <button class="filtro-btn" data-acao="filtrar" data-filtro="dms">⏰ Automáticos</button>
</div>

<!-- Lista de alertas -->
<div class="alertas-list" id="alertas-list">
  <div class="empty"><div class="empty-icon">📡</div><p>Carregando...</p></div>
</div>

<div class="nav-spacer"></div>
<div class="toast" id="toast"></div>

<script src="/static/js/painel.js"></script>
</body>
</html>
