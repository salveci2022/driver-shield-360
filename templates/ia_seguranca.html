<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shield AI — Driver Shield 360</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/css/ia_seguranca.css">
</head>
<body>

<div class="header">
  <div class="logo">DRIVER<span>·SHIELD</span> 360</div>
  <div class="ai-badge"><div class="ai-dot"></div> Shield AI</div>
</div>

<div class="chat-area" id="chat-area">
  <div class="welcome" id="welcome-screen">
    <div class="welcome-icon">🤖</div>
    <div class="welcome-title">Shield AI</div>
    <div class="welcome-sub">Assistente especializado em segurança para motoristas. Tire dúvidas, receba orientações e dicas de proteção.</div>
    <div class="sugestoes">
      <button class="sug-btn" data-acao="enviarSugestao">O que fazer em caso de assalto?</button>
      <button class="sug-btn" data-acao="enviarSugestao">Dicas de segurança para motoristas mulheres</button>
      <button class="sug-btn" data-acao="enviarSugestao">Passageiro está se comportando de forma estranha</button>
      <button class="sug-btn" data-acao="enviarSugestao">Como acionar a polícia de forma discreta?</button>
      <button class="sug-btn" data-acao="enviarSugestao">Rotas seguras e horários de risco</button>
    </div>
  </div>
</div>

<div class="input-bar">
  <textarea
    class="msg-input"
    id="msg-input"
    placeholder="Pergunte sobre segurança..."
    rows="1"
    maxlength="2000"
  ></textarea>
  <button class="btn-send" id="btn-send" data-acao="enviar">➤</button>
</div>

<div class="nav-bar">
  <a href="/motorista" class="nav-item">
    <span class="nav-icon">🛡️</span>SOS
  </a>
  <a href="/cadastro" class="nav-item">
    <span class="nav-icon">👥</span>Contatos
  </a>
  <a href="/ia" class="nav-item ativo">
    <span class="nav-icon">🤖</span>Shield AI
  </a>
</div>

<script src="/static/js/ia.js"></script>
</body>
</html>
